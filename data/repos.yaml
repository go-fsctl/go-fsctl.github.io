# One card per real, non-fork repo in the go-fsctl org.
#
# ⛔ That sentence was already here, and was false: blk and outdir were
# created after this file was last touched and neither appeared on the site
# or in the docs, so two of seven modules were invisible to a reader. A
# comment stating a rule does not keep the data to it. The count on the page
# is derived from this list rather than typed beside it, so the next module
# that is missing here is missing everywhere, visibly.
#
# kind = lib   -> a kernel-ioctl / filesystem control library
#
# ⛔ There is no "tool" kind any more. outdir was the only one, and it was
# the only module here that opened nothing -- it moved to
# github.com/go-appdirs/outdir, where the siblings it belongs with can join
# it. A kind invented for a single exception is a sign the exception is in
# the wrong place.
# ci   = true  -> the repo really has .github/workflows/ci.yml (checked by
#                 listing the tree, not by remembering)
modules:
  - name: loop
    kind: lib
    ci: true
    gate: true
    os: "linux"
    desc: "Loop devices via <code>/dev/loop-control</code> and <code>LOOP_*</code> ioctls — attach, detach, query status and resize backing files. No <code>losetup</code>, no cgo."
  - name: dm
    kind: lib
    ci: true
    gate: true
    os: "linux"
    desc: "Device-mapper via <code>/dev/mapper/control</code> and <code>DM_*</code> ioctls — linear, striped, crypt, thin and verity targets with scrub-style status. No <code>dmsetup</code>."
  - name: btrfs
    kind: lib
    ci: true
    gate: true
    os: "linux"
    desc: "btrfs via <code>BTRFS_IOC_*</code> ioctls on directory fds — subvolumes, snapshots, scrub, balance, qgroups and send. No <code>btrfs(8)</code>."
  - name: zfs
    kind: lib
    ci: true
    gate: true
    os: "linux"
    desc: "OpenZFS via <code>/dev/zfs</code> and <code>ZFS_IOC_*</code> ioctls — pools, datasets, encryption, send/recv and clone. No <code>libzfs</code>, no cgo."
  - name: blk
    kind: lib
    ci: true
    gate: false
    os: "linux"
    desc: "Block devices via <code>BLKGETSIZE64</code>, <code>BLKDISCARD</code>, <code>BLKZEROOUT</code>, <code>BLKPG</code> and the rest — size, block and I/O geometry, discard, and adding or removing partitions without re-reading the table."
  - name: cowclone
    kind: lib
    ci: true
    gate: true
    os: "linux, darwin, and a byte-copy fallback everywhere else"
    desc: "Copy-on-write file cloning via APFS <code>clonefile(2)</code> and Linux <code>FICLONE</code> reflink (btrfs, XFS, OpenZFS 2.2+), with a transparent byte-copy fallback everywhere else. No cgo."
